name: Release container image

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Stable package version to publish (X.Y.Z)"
        required: true
        type: string
      publish_latest:
        description: "Also update latest (allowed only from main)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate release version and ref
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_LATEST: ${{ inputs.publish_latest }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          package_version=$(python -c 'from findhub_relay import __version__; print(__version__)')
          if [[ "$EVENT_NAME" == "push" ]]; then
            [[ "$TAG_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]] || {
              echo "Release tags must match vX.Y.Z" >&2
              exit 1
            }
            version=${BASH_REMATCH[1]}
            publish_latest=true
          else
            [[ "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "Manual version must match X.Y.Z" >&2
              exit 1
            }
            version=$INPUT_VERSION
            publish_latest=false
            if [[ "$INPUT_LATEST" == "true" ]]; then
              [[ "$REF_NAME" == "main" ]] || {
                echo "latest can be published manually only from main" >&2
                exit 1
              }
              publish_latest=true
            fi
          fi
          [[ "$version" == "$package_version" ]] || {
            echo "Requested version $version does not match package version $package_version" >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish_latest=$publish_latest" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: herlambang333/google-find-hub-traccar
          tags: |
            type=raw,value=${{ steps.release.outputs.version }}
            type=raw,value=latest,enable=${{ steps.release.outputs.publish_latest == 'true' }}
          labels: |
            org.opencontainers.image.version=${{ steps.release.outputs.version }}

      - name: Build and push multi-platform image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.release.outputs.version }}
          provenance: mode=max
          sbom: true
